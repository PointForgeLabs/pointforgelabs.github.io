<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plotter Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#bbb;font-family:'DM Mono','SF Mono',monospace;overflow:hidden}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#333;outline:none;border-radius:2px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:#888;border-radius:50%;cursor:pointer}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:#888;border-radius:50%;cursor:pointer;border:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0a0a0a}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="core.js"></script>
<script src="features.js"></script>
<script src="trace.js"></script>
<script src="app.js"></script>
</body>
</html>
